services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot-certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./admin/my-dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_SECRETBOX_KEY_B64=${VITE_SECRETBOX_KEY_B64}
    restart: always
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
